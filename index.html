<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Danju̇.</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Danju̇">
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest.webmanifest?v=0.91.1">
<link rel="apple-touch-icon" href="danju2-180.png">
<link rel="icon" href="danju2-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Black+Han+Sans&display=swap">
<style>
/* Danju̇ v0.91.2 — 점멸 화면(검정) ⇄ 단어장 화면(고쉐 단어장과 같은 흰 화면) */
:root{
  --ink:#0b0b0d;--paper:#f5f5f7;
  --magenta:#ff2bd6;--neon:#39ff14;--yellow:#ffe600;--blue:#2a7bff;
  --f-en:"Archivo Black","Arial Black",Impact,sans-serif;
  --f-ko:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  /* 단어장(고쉐 색) */
  --bg:#fff;--v-ink:#1f2a37;--sub:#6b7a8c;--faint:#9aa7b5;--line:#e4e9ef;--line2:#d9e2ea;--soft:#eef3f7;--soft2:#f6f8fa;--navy:#4f6d8a;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
html.onflash,html.onflash body{background:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}
.hidden{display:none!important}

#rail{position:fixed;top:0;left:0;height:100vh;height:100dvh;display:flex;width:200%;transition:transform .38s cubic-bezier(.22,.8,.24,1);will-change:transform;backface-visibility:hidden}
#rail{transform:translate3d(0,0,0)}
#rail.flash{transform:translate3d(-50%,0,0)}
#rail.drag{transition:none}
.screen{position:relative;width:50%;height:100%;overflow:hidden}

/* ── 점멸 화면 ── */
#flash{background:var(--ink);color:var(--paper);touch-action:none;cursor:pointer}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:var(--safe-t) max(16px,env(safe-area-inset-right,0px)) var(--safe-b) max(16px,env(safe-area-inset-left,0px))}
/* 영어·한국어를 같은 칸에 겹쳐 두고 보이는 쪽만 바꿈 — 상자 크기가 변하지 않아 흔들림 없음 */
#word{display:grid;place-items:center;max-width:100%;font-size:clamp(44px,13vw,150px);text-align:center}
#word>span{grid-area:1/1;line-height:1.12;white-space:nowrap;text-box:trim-both cap alphabetic;visibility:hidden}
#w-en{font-family:var(--f-en);letter-spacing:-.01em}
#w-ko{font-family:var(--f-ko)}
#word>span.on{visibility:visible}
/* 속도계: 오른쪽 세로 막대 + 가로 눈금 + 작은 회/초 */
#meter{position:absolute;right:max(24px,calc(env(safe-area-inset-right,0px) + 14px));top:22%;height:56%;width:3px;border-radius:2px;
  background:rgba(245,245,247,.14);opacity:0;transition:opacity .35s;pointer-events:none}
#meter.show{opacity:1;transition:opacity .12s}
#tick{position:absolute;right:-9px;width:21px;height:3px;border-radius:2px;background:var(--paper);transform:translateY(-50%);transition:top .1s}
#hz{position:absolute;right:22px;transform:translateY(-50%);font-size:12px;color:rgba(245,245,247,.45);white-space:nowrap;
  font-variant-numeric:tabular-nums;transition:top .1s}
/* 하단 가운데: 글자 없는 타원 토글 (꺼짐 = 영한영한영한, 켜짐 = 영영영한한한) */
#mode{position:absolute;left:50%;bottom:calc(var(--safe-b) + 34px);transform:translateX(-50%);width:52px;height:30px;border-radius:15px;
  background:rgba(245,245,247,.12)}
#mode i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:rgba(245,245,247,.35);transition:left .2s,background .2s}
#mode.on i{left:25px}

/* ── 단어장 화면 (고쉐 단어장 그대로) ── */
#vocab{touch-action:pan-y;background:var(--bg);color:var(--v-ink);display:flex;flex-direction:column;padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
#vocab .in{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto}
#titlebar{flex:none;height:52px;display:flex;align-items:center;padding:0 20px}
#logo{position:relative;flex:none;width:calc((100% + 40px) * 2 / 3);height:52px;margin-left:-20px;padding-left:20px;font-size:23px;font-weight:800;font-style:italic;letter-spacing:-.01em;white-space:nowrap;-webkit-user-select:none;user-select:none;touch-action:none}
#logo .lA,#logo .lB{position:absolute;left:20px;top:11px;line-height:30px;transition:opacity .12s ease,letter-spacing .22s ease,transform .22s ease;transform-origin:left center}
#logo .lB{opacity:0;letter-spacing:-.12em;transform:scaleX(.7)}
#logo.on .lA{opacity:0;letter-spacing:.15em}
#logo.on .lB{opacity:1;letter-spacing:-.01em;transform:none}
/* u 위 점 하나 = 같은 글꼴의 i 점만 잘라 u 가운데 위에 얹음 */
#logo .ud{position:relative;display:inline-block}
#logo .ud .dt{position:absolute;left:50%;top:0;transform:translateX(-50%);clip-path:inset(0 0 64% 0);pointer-events:none}
#logo .n{color:#c97fb9}
#pVocab{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 20px}
.vhead{flex:none;display:flex;align-items:center;gap:10px;padding:2px 0 10px}
.toggle{position:relative;display:flex;background:var(--soft);border-radius:16px;padding:2px}
.toggle button{position:relative;z-index:1;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:14px;color:var(--faint);transition:color .2s}
.toggle button.on{color:var(--v-ink)}
.toggle .pill{position:absolute;top:2px;bottom:2px;left:2px;width:30px;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:left .25s cubic-bezier(.3,.7,.3,1),width .25s cubic-bezier(.3,.7,.3,1)}
.vhead .toggle{margin-left:auto}
.vio{color:var(--sub);padding:6px;display:flex}
.vio:disabled{color:#d3dbe3}
#vWrap{flex:1;min-height:0;position:relative}
/* 드럼: 한 칸씩 가운데에 걸림, 위아래 색 차이 없음 */
#vList{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-y}
#vList::-webkit-scrollbar{display:none}
#vList .pad{scroll-snap-align:none;pointer-events:none}
.v{position:relative;overflow:hidden;border-bottom:1px solid var(--line);scroll-snap-align:center}
.v:last-of-type{border-bottom:none}
.v .face{position:relative;display:grid;grid-template-columns:calc(40% - 12px) 1fr;gap:12px;align-items:baseline;padding:9px 30px 9px 2px;background:#fff}
.v .en{font-size:14.5px;font-weight:600;line-height:1.35;word-break:break-word}
.v .ko{font-size:13px;color:var(--sub);line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.v .under{position:absolute;inset:0;display:flex;align-items:center;padding:0 16px;opacity:0;font-size:12px}
.under.del{background:var(--soft);color:var(--sub);justify-content:flex-start}
/* 삭제 토글: 모든 단어가 한 칸 오른쪽 + 앞에 작은 휴지통 — 휴지통을 누른 채 오른쪽으로 밀어야 삭제 */
.v .trash{position:absolute;left:4px;top:0;bottom:0;display:flex;align-items:center;color:#9aa7b5;pointer-events:none;opacity:0;transition:opacity .2s}
#vList.delon .v .trash{opacity:1}
#vList.delon .v .face{transform:translateX(22px)}
#vList.delon .under.del{padding-left:30px}
#vList.nt .v .face{transition:none!important}
#vList.m-en .v .ko{visibility:hidden}
#vList.m-ko .v .en{visibility:hidden}
#vList .v.peek .en,#vList .v.peek .ko{visibility:visible}
.v.peek .face{background:var(--soft2)}
.v [contenteditable="true"]{outline:none;-webkit-user-select:text;user-select:text;caret-color:var(--navy)}
/* 선택: 별 단어는 한 칸 오른쪽 + 앞에 노란 별 (선택 토글이 켜졌을 때만 보임) */
.v .star{position:absolute;left:4px;top:0;bottom:0;display:flex;align-items:center;color:#ffc000;font-size:13px;line-height:1;pointer-events:none;opacity:0;transition:opacity .2s}
#vList.selon .v.sel .star{opacity:1}
.v .face{transition:transform .2s cubic-bezier(.3,.7,.3,1)}
#vList.selon .v.sel .face{transform:translateX(22px)}
/* 추가 줄: 평소엔 빈 공백 한 줄, 추가 모드엔 한·영 옅은 음영 칸 */
.va{border-bottom:1px solid transparent}
.va .face{display:grid;grid-template-columns:calc(40% - 12px) 1fr;gap:12px;align-items:center;padding:9px 30px 9px 2px;min-height:38px}
#vAdd.on .va{border-bottom-color:var(--line)}
.va input{display:block;border:none;outline:none;background:transparent;font:inherit;padding:0;margin:0;width:100%;height:19px;border-radius:4px;
  caret-color:#9cc3e6;-webkit-appearance:none;appearance:none}
.va input.ko{font-size:13px;color:var(--sub)}
.va input.en{font-size:14.5px;font-weight:600;color:var(--v-ink)}
.va input.blank{background:#eef2f6}
.va input.en.blank{width:calc(var(--bw,115px) * 1.25)}
.search .plus{display:none;width:16px;text-align:center;font-size:20px;line-height:1;color:var(--sub)}
.search.add .plus{display:block}.search.add>svg{display:none}
.search input{-webkit-touch-callout:none}
.vempty{font-size:13px;color:var(--faint);text-align:center;padding:40px 0;line-height:1.7}
/* 핀: 라인 전체 아주 옅은 음영 + 기울어진 핀(한국어 글자색) — 핀은 밀어도 제자리 */
.v.pin,.v.pin .face{background:#f5f8fb}
.v .pinx{position:absolute;right:24px;top:0;bottom:0;display:flex;align-items:center;color:var(--sub);pointer-events:none;z-index:1}
#pinGo{position:absolute;left:0;right:0;bottom:0;height:calc(var(--safe-b) + max(4px,calc(20px - var(--safe-b))));z-index:2}
#vMark{position:absolute;right:-14px;top:50%;width:0;height:0;transform:translateY(-50%);
  border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:7px solid #c9d3dd;pointer-events:none}
/* 가운데 표시(삼각형) 앞 단어 번호 — 꾹 누르면 숫자가 지워지고 흐린 파란 커서만 */
#vNum{position:absolute;right:2px;top:50%;transform:translateY(-50%);min-width:1.6em;text-align:right;font-size:10.5px;color:var(--faint);
  font-variant-numeric:tabular-nums;line-height:20px;touch-action:none;-webkit-user-select:none;user-select:none;cursor:pointer}
#vNum .goin{width:2.6em;border:none;outline:none;background:transparent;font:inherit;font-size:16px;transform:scale(.66);transform-origin:right center;
  color:var(--v-ink);caret-color:#9cc3e6;text-align:right;padding:0;margin:0;-webkit-user-select:text;user-select:text}
.search{flex:none;height:44px;margin:8px 0 max(4px,calc(20px - var(--safe-b)));border-radius:12px;background:var(--soft2);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--faint);font-size:14px}
.search input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-size:14px;color:var(--v-ink)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
#vClear{flex:none;width:28px;height:28px;margin-right:-6px;display:flex;align-items:center;justify-content:center}
/* 토글 모음: 목록 안 첫 단어 바로 위(스크롤하면 같이 올라감) — 세로 타원 + 아래 작은 글씨 */
.tgs{display:flex;gap:12px;align-items:flex-end;padding:0 0 10px}
.tg{display:flex;flex-direction:column;align-items:center;gap:5px}
.tg small{font-size:10px;color:var(--sub);letter-spacing:.02em;line-height:1}
.vt{position:relative;width:22px;height:38px;border-radius:11px;background:var(--soft);border:1px solid var(--line)}
.vt.three{height:50px}
.vt i{position:absolute;left:2px;width:16px;height:16px;border-radius:50%;background:#c3ccd6;transition:top .18s cubic-bezier(.3,.7,.3,1),background .18s}
.vt[data-v="0"] i{top:calc(100% - 18px)}
.vt[data-v="1"] i{top:2px}
.vt.three[data-v="1"] i{top:calc(50% - 8px)}
.vt.three[data-v="2"] i{top:2px}
/* 버전: 검색창 아래 하단 여백(홈 막대 위)에 — 목록·검색창 위치에 영향 없음 */
#ver{position:absolute;left:0;right:0;bottom:max(2px,calc(var(--safe-b) - 16px));line-height:12px;text-align:center;font-size:10.5px;color:var(--faint);letter-spacing:.04em;font-variant-numeric:tabular-nums;pointer-events:none}
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translateX(-50%);background:rgba(31,42,55,.88);color:#fff;font-size:13px;
  padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:10}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="rail">
  <!-- ① 단어장 화면 (처음 화면) -->
  <section class="screen" id="vocab"><div class="in">
    <div id="titlebar"><div id="logo"><span class="lA"><span class="n">Dan</span>j<span class="ud">u<span class="dt" aria-hidden="true">i</span></span>.</span><span class="lB"><span class="n">단어</span> 주사기.</span></div></div>
    <div id="pVocab">
      <div class="vhead">
        <button class="vio" id="vExport" aria-label="단어장 내보내기"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button><button class="vio" id="vImport" aria-label="단어장 가져오기"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
        <button class="vio" id="vUndo" aria-label="되돌리기" disabled><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <input id="vFile" type="file" accept=".csv,text/csv,text/comma-separated-values,text/plain" hidden>
        <div class="toggle" id="vToggle"><span class="pill"></span><button data-m="ko">한</button><button data-m="en">영</button><button data-m="both">둘 다</button></div>
      </div>
      <div id="vWrap"><div id="vList"></div><div id="vNum"></div><div id="vMark"></div></div>
      <div class="search"><span class="plus" aria-hidden="true">+</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa7b5" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="vSearch" type="search" enterkeyhint="search" placeholder="저장한 단어 검색" autocomplete="off"><button id="vClear" class="hidden" aria-label="검색어 지우기"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#c3ccd6"/><path d="M5.3 5.3l5.4 5.4M10.7 5.3l-5.4 5.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
      <div id="ver">v0.91.2</div>
    </div>
  </div><div id="pinGo" aria-label="핀 위치로"></div></section>

  <!-- ② 점멸 화면 -->
  <section class="screen" id="flash">
    <div id="stage"><div id="word"><span id="w-en" class="on"></span><span id="w-ko"></span></div></div>
    <div id="meter"><div id="tick"></div><div id="hz"></div></div>
    <button id="mode" aria-label="자동넘김"><i></i></button>
  </section>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COLORS=["--magenta","--neon","--yellow","--blue"].map(css);

/* ── 저장 ── */
const KEY="wi-v1";
const SAMPLE=[["serendipity","뜻밖의 행운"],["meticulous","꼼꼼한"],["ubiquitous","어디에나 있는"],["candid","솔직한"],["resilient","회복력 있는"],["ambiguous","애매한"],
  ["deteriorate","악화되다"],["leverage","지렛대로 활용하다"],["impairment","손상"],["accrue","발생하다, 누적되다"],["scrutiny","면밀한 조사"],["contingent","~에 달린, 우발적인"]];
let DB=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}})();
if(!DB){let old=null;try{old=JSON.parse(localStorage.getItem("bbak-words")||"null")}catch(e){}   // v0.1에서 불러둔 단어 이어받기
  DB={voc:(Array.isArray(old)&&old.length?old:SAMPLE).map(([en,ko])=>({en,ko})),hz:2,grouped:false,vmode:"both",pos:0};}
let saveT=null;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast("저장 공간이 부족해요")}},150);}
const VOC=()=>DB.voc;

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1600);}

/* ── 소리 (고쉐와 같은 합성음) ── */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume().catch(()=>{});return AC;}
function tone(f,type,vol,dec){const a=ac();if(!a)return;const t=a.currentTime+.005,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dec);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dec+.05);}
function noise(dur,vol,f0){const a=ac();if(!a)return;const n=Math.max(1,Math.floor(a.sampleRate*dur)),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type="highpass";f.frequency.value=f0;
  const g=a.createGain(),t=a.currentTime+.005;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.25);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+dur+.02);}
function beep(f,dur){const a=ac();if(!a)return;const t=a.currentTime+.005,o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter(),v=.06;
  o.type="square";o.frequency.value=f;lp.type="lowpass";lp.frequency.value=7000;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.003);g.gain.setValueAtTime(v,t+dur-.01);g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(lp).connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);}
const SFX={
  tick(){noise(.006,.5*1.29,5000);tone(3200,"sine",.18*1.29,.012);},                 // 틱 — 드럼·속도계 걸림
  tok(){tone(2093,"triangle",.7*.38,.16);tone(4186,"sine",.15*.38,.08);},
  tuk(){tone(392,"triangle",.7*.38,.14);tone(784,"sine",.1*.38,.06);},               // 툭 — 선택 해제 (삑보다 낮게)
  ti(){beep(4096,.045);},                                                            // 띠 — 점멸
  tiLong(){beep(4096,.32);},                                                         // 띠~ — 단어 시작             // 톡 — 버튼·꾹 누르기
};
/* 로고 뿅 — 고쉐와 같은 녹음 파일(sfx/logo.wav), '톡'과 같은 크기 */
let LOGO_BUF=null,LOGO_BUSY=false;
function loadLogo(a){if(LOGO_BUF||LOGO_BUSY||!a)return;LOGO_BUSY=true;
  fetch("sfx/logo.wav").then(r=>r.arrayBuffer()).then(b=>new Promise((ok,ng)=>a.decodeAudioData(b,ok,ng))).then(d=>{LOGO_BUF=d}).catch(()=>{}).finally(()=>{LOGO_BUSY=false});}
SFX.logo=function(){const a=ac();if(!a)return;if(!LOGO_BUF){loadLogo(a);return;}
  const s=a.createBufferSource(),g=a.createGain();g.gain.value=.897;s.buffer=LOGO_BUF;s.connect(g).connect(a.destination);s.start(a.currentTime+.005);};
/* 로고 기믹 — 손을 올려두면 "Danju̇." → "단어 주사기.", 떼면 원래대로 (고쉐와 동일) */
(()=>{const L=document.getElementById("logo");if(!L)return;
  const on=e=>{e.stopPropagation();const a=ac();loadLogo(a);if(!L.classList.contains("on"))SFX.logo();L.classList.add("on");},
        off=()=>L.classList.remove("on");
  L.addEventListener("pointerdown",on);["pointerup","pointercancel","pointerleave"].forEach(t=>L.addEventListener(t,off));})();

/* ══════════ 점멸 ══════════ */
const LEVELS=[];for(let v=1;v<=3.0001;v+=.25)LEVELS.push(+v.toFixed(2));   // 1 ~ 3회/초, 0.25 간격
if(!LEVELS.includes(DB.hz))DB.hz=2;
let playing=false,timer=null,steps=[],stepIdx=0,lastColor=-1;
const wordEl=$("#word"),stage=$("#stage");

function pickColor(){let c;do{c=Math.floor(Math.random()*COLORS.length)}while(c===lastColor&&COLORS.length>1);lastColor=c;return COLORS[c];}
function curWord(){const v=VOC();if(!v.length)return{en:"",ko:""};DB.pos=((DB.pos%v.length)+v.length)%v.length;return v[DB.pos];}
function buildSet(){const{en,ko}=curWord();$("#w-en").textContent=en;$("#w-ko").textContent=ko;fitWords();wordEl.style.color=pickColor();
  const n=3+(DB.cnt||0);steps=[];for(let i=0;i<2*n;i++){const isKo=DB.grouped?i>=n:i%2===1,l=isKo?"ko":"en";steps.push({on:true,l,first:i===0},{on:false,l});}
  steps.push({gap:true});stepIdx=0;}
function show(s){const en=$("#w-en"),ko=$("#w-ko");if(s.gap){en.classList.remove("on");ko.classList.remove("on");return;}
  en.classList.toggle("on",s.on&&s.l==="en");ko.classList.toggle("on",s.on&&s.l==="ko");}
function selMode(){return !!DB.sel&&VOC().some(v=>v.sel);}
function nextPos(p){const v=VOC();if(!selMode())return p+1;for(let k=1;k<=v.length;k++){const j=(p+k)%v.length;if(v[j].sel)return j;}return p+1;}
let goOn=false;   // 자동넘김 꺼짐: 한 단어 끝나면 멈추고, 화면을 터치해야 다음 단어
function step(){if(!playing)return;if(stepIdx>=steps.length){if(DB.auto===false&&!goOn){playing=false;return;}goOn=false;DB.pos=nextPos(DB.pos);save();buildSet();}
  const s=steps[stepIdx++];show(s);if(s.on&&DB.snd)(s.first?SFX.tiLong:SFX.ti)();
  const cyc=1000/DB.hz,onR=DB.hz>=2.75?1/2:2/3;   // 2.75회/초 이상은 켜짐·꺼짐 같게, 그 아래는 켜짐:꺼짐 = 2:1
  timer=setTimeout(step,s.gap?350:(s.on?cyc*onR:cyc*(1-onR)));}
function setPlaying(p){playing=p;clearTimeout(timer);if(p){goOn=stepIdx>=steps.length;step();}}   // 끝에서 멈춰 있을 때 터치 = 다음 단어                      // 멈추면 그 화면 그대로
// 항상 한 줄: 화면 폭보다 길면 그 단어만 글자를 줄임
/* 영어는 항상 한 줄. 한국어는 두 줄까지 — 쉼표·괄호 같은 구분 위치에서만 끊어 뜻이 잘리지 않게.
   구분 위치가 없거나 두 줄로도 넘치면 그 단어만 글자를 줄임 */
const MC=document.createElement("canvas").getContext("2d");
function koChunks(t){const out=[];let cur="";for(let i=0;i<t.length;i++){const c=t[i];
    if((c==="("||c==="[")&&cur.trim()){out.push(cur.trimEnd());cur="";}
    cur+=c;if(/[,，、;·\/)\]]/.test(c)&&i<t.length-1){out.push(cur.trimEnd());cur="";}}
  if(cur.trim())out.push(cur.trim());return out.map(x=>x.trim()).filter(Boolean);}
function setKo(el,ko,maxW,base){el.style.fontSize="";el.textContent=ko;
  MC.font=getComputedStyle(el).font;const W=x=>MC.measureText(x).width,one=W(ko);
  if(one<=maxW)return;
  const ch=koChunks(ko);
  if(ch.length<2){el.style.fontSize=Math.floor(base*maxW/one*.98)+"px";return;}
  let best=null;for(let k=1;k<ch.length;k++){const a=ch.slice(0,k).join(" "),b=ch.slice(k).join(" "),m=Math.max(W(a),W(b));if(!best||m<best.m)best={a,b,m};}
  el.textContent="";el.append(best.a,document.createElement("br"),best.b);
  if(best.m>maxW)el.style.fontSize=Math.floor(base*maxW/best.m*.98)+"px";}
function fitWords(){const cs=getComputedStyle(stage),maxW=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const base=parseFloat(getComputedStyle(wordEl).fontSize);
  const en=$("#w-en");en.style.fontSize="";const w=en.getBoundingClientRect().width;if(w>maxW)en.style.fontSize=Math.floor(base*maxW/w*.98)+"px";
  setKo($("#w-ko"),curWord().ko,maxW,base);}
addEventListener("resize",fitWords);document.fonts&&document.fonts.ready.then(()=>{fitWords();fixDot();});
/* u 위 점: 같은 글꼴에서 점 없는 ı의 줄기 꼭대기를 재고, 그 바로 위에서 i를 잘라 점만 남김 */
function fixDot(){const d=$("#logo .dt");if(!d)return;
  const b=document.createElement("span"),x=document.createElement("span");
  b.style.cssText="display:inline-block;width:0;height:0;vertical-align:baseline";               // 높이 0 → 위쪽 = 기준선
  x.style.cssText="position:absolute;visibility:hidden;width:0;height:1ex";                      // 그 글꼴의 소문자 높이
  d.append(b,x);const base=b.offsetTop,xh=x.offsetHeight,h=d.offsetHeight;b.remove();x.remove();
  if(!(base>0&&xh>0&&h>0))return;
  const keep=base-xh*1.05;                                                                       // 줄기 꼭대기 바로 위까지만 남김
  d.style.clipPath=`inset(0 0 ${Math.max(0,h-keep).toFixed(1)}px 0)`;}
fixDot();

/* 속도계 */
let meterT=null;
function drawMeter(showIt){const i=LEVELS.indexOf(DB.hz),pct=i/(LEVELS.length-1)*100,top=(100-pct)+"%";
  $("#tick").style.top=top;$("#hz").style.top=top;$("#hz").textContent=DB.hz+"회/초";
  if(showIt){$("#meter").classList.add("show");clearTimeout(meterT);meterT=setTimeout(()=>$("#meter").classList.remove("show"),1200);}}
function stepHz(dir){const i=LEVELS.indexOf(DB.hz),j=Math.max(0,Math.min(LEVELS.length-1,i+dir));drawMeter(true);
  if(j===i)return false;DB.hz=LEVELS[j];save();SFX.tick();drawMeter(true);return true;}

/* 하단 토글: 순서 (꺼짐 영한영한영한 / 켜짐 영영영한한한) */
if(DB.auto===undefined)DB.auto=true;
const modeBtn=$("#mode");modeBtn.classList.toggle("on",DB.auto);
modeBtn.addEventListener("pointerdown",e=>e.stopPropagation());
modeBtn.addEventListener("click",e=>{e.stopPropagation();ac();SFX.tok();DB.auto=!DB.auto;modeBtn.classList.toggle("on",DB.auto);save();});

/* 점멸 화면 손동작: 위아래 = 속도(단계마다 살짝 걸림), 오른쪽 밀기 = 단어장, 터치 = 일시정지/점멸 */
const STEP_PX=34,DETENT_MS=110;
(()=>{const el=$("#flash");let g=null;
  el.addEventListener("pointerdown",e=>{if(e.button>0)return;ac();g={x0:e.clientX,y0:e.clientY,ly:e.clientY,axis:null,acc:0,lock:0,t:performance.now()};try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener("pointermove",e=>{if(!g)return;const dx=e.clientX-g.x0,dy=e.clientY-g.y0;
    if(!g.axis&&Math.hypot(dx,dy)>10){g.axis=Math.abs(dx)>Math.abs(dy)?"x":"y";if(g.axis==="x")prepVocab();}
    if(g.axis==="y"){const now=performance.now(),d=g.ly-e.clientY;g.ly=e.clientY;
      if(now<g.lock)return;                                   // 방금 한 칸 넘어감 → 잠깐 걸림
      g.acc+=d;if(Math.abs(g.acc)>=STEP_PX){const ok=stepHz(g.acc>0?1:-1);g.acc=0;if(ok)g.lock=now+DETENT_MS;}}
    else if(g.axis==="x"){$("#rail").classList.add("drag");$("#rail").style.transform=`translate3d(calc(-50% + ${Math.max(0,dx-10)}px),0,0)`;}});
  const end=e=>{if(!g)return;const G=g;g=null;const rail=$("#rail");rail.classList.remove("drag");rail.style.transform="";
    if(!G.axis&&e.type==="pointerup"){setPlaying(!playing);return;}
    if(G.axis==="x"&&flick(e.clientX-G.x0,G.t,1))goVocab();};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  el.addEventListener("wheel",e=>{e.preventDefault();stepHz(e.deltaY<0?1:-1);},{passive:false});})();
document.addEventListener("keydown",e=>{if(!$("#rail").classList.contains("flash"))return;
  if(e.code==="ArrowUp"){e.preventDefault();stepHz(1)}if(e.code==="ArrowDown"){e.preventDefault();stepHz(-1)}
  if(e.code==="Space"){e.preventDefault();setPlaying(!playing)}if(e.code==="ArrowRight")goVocab();});

/* ══════════ 화면 전환 ══════════ */
/* 무거운 준비(목록 그리기·단어 맞추기)는 끌기 시작할 때 미리 해 두고, 넘어가는 동안엔 움직임만 */
let vReady=false,fReady=false;
function flick(dx,t0,dir){const v=dx/Math.max(1,performance.now()-t0);return dx*dir>60||(dx*dir>20&&v*dir>.45);}   // 60px 넘거나 빠르게 튕기면 넘어감
let vDrawn=false;   // 목록은 한 번 그려 두고, 넘어올 때는 위치만 맞춤 (검색 중이었을 때만 다시 그림)
function prepVocab(){if(vReady)return;vReady=true;const q=$("#vSearch").value;$("#vSearch").value="";$("#vClear").classList.add("hidden");
  if(!vDrawn||q){renderVocab();vDrawn=true;}scrollToWord(DB.pos,false);}
function prepFlash(){if(fReady)return;fReady=true;const ci=centerIndex();if(ci!==null)DB.pos=ci;
  if(selMode()&&!(VOC()[DB.pos]||{}).sel)DB.pos=nextPos(DB.pos);save();
  setPlaying(false);buildSet();show(steps[0]);stepIdx=1;}
function goVocab(){setPlaying(false);prepVocab();$("#rail").classList.remove("flash");document.documentElement.classList.remove("onflash");fReady=false;}
function goFlash(){if(EDITING)return;$("#vSearch").blur();prepFlash();$("#rail").classList.add("flash");document.documentElement.classList.add("onflash");vReady=false;}   // 가운데 단어로, 정지 상태(터치하면 점멸)

/* ══════════ 단어장 (고쉐 단어장 + 드럼 + 꾹 눌러 고치기) ══════════ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=t=>String(t).replace(/\s+/g," ").trim();
const same=(a,b)=>norm(a.en).toLowerCase()===norm(b.en).toLowerCase()&&norm(a.ko)===norm(b.ko);   // 한·영 둘 다 같아야 같은 단어
const VDEL=[];let EDITING=false,lastC=null,userScroll=false;
const list=$("#vList");

function movePill(){const t=$("#vToggle"),b=t.querySelector(`button[data-m="${DB.vmode}"]`),p=t.querySelector(".pill");if(!b)return;
  p.style.left=b.offsetLeft+"px";p.style.width=b.offsetWidth+"px";t.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));}
function applyV(){list.classList.toggle("m-en",DB.vmode==="en");list.classList.toggle("m-ko",DB.vmode==="ko");}
$$("#vToggle button").forEach(b=>b.onclick=()=>{ac();SFX.tok();DB.vmode=b.dataset.m;save();movePill();applyV();});

$("#vUndo").onclick=()=>{const d=VDEL.pop();if(!d)return;ac();SFX.tok();
  if(d.edit){const k=VOC().indexOf(d.obj);if(k>=0&&d.obj[d.field]===d.now){const nv={...d.obj,[d.field]:d.orig};
      if(!VOC().some((v,i)=>i!==k&&same(v,nv)))d.obj[d.field]=d.orig;}
    save();renderVocab();if(k>=0)scrollToWord(k,true);return;}                                      // 수정 되돌리기 = 고치기 전으로
  if(d.v.pin&&VOC().some(v=>v.pin))delete d.v.pin;
  if(!VOC().some(v=>same(v,d.v))){VOC().splice(Math.min(d.k,VOC().length),0,d.v);if(d.k<=DB.pos)DB.pos++;}
  save();renderVocab();scrollToWord(Math.min(d.k,VOC().length-1),true);};

/* 토글 모음 (반복 / 횟수 3·4·5 / 소리) */
const TGS=()=>`<div class="tgs"><button class="tg" data-k="grouped" aria-label="반복"><span class="vt" data-v="${DB.grouped?1:0}"><i></i></span><small>반복</small></button>`+
  `<button class="tg" data-k="cnt" aria-label="횟수"><span class="vt three" data-v="${DB.cnt||0}"><i></i></span><small>횟수</small></button>`+
  `<button class="tg" data-k="snd" aria-label="소리"><span class="vt" data-v="${DB.snd?1:0}"><i></i></span><small>소리</small></button>`+
  `<button class="tg" data-k="del" aria-label="삭제"><span class="vt" data-v="${DB.del?1:0}"><i></i></span><small>삭제</small></button>`+
  `<button class="tg" data-k="sel" aria-label="선택"><span class="vt" data-v="${DB.sel?1:0}"><i></i></span><small>선택</small></button></div>`;
list.addEventListener("click",e=>{const b=e.target.closest(".tg");if(!b)return;ac();SFX.tok();const k=b.dataset.k,t=b.querySelector(".vt");
  if(k==="cnt"){DB.cnt=((DB.cnt||0)+1)%3;t.dataset.v=DB.cnt;}else{DB[k]=!DB[k];t.dataset.v=DB[k]?1:0;}
  if((k==="del"||k==="sel")&&DB[k]){const o=k==="del"?"sel":"del";DB[o]=false;const ob=$(`#vList .tg[data-k="${o}"] .vt`);if(ob)ob.dataset.v=0;}   // 삭제·선택은 하나만
  if(k==="del"||k==="sel")slideSel();else applySel();save();fReady=false;});
/* 삭제·선택 켜고 끌 때 보이는 줄을 직접 부드럽게 밀기 (아이폰에서 자동 효과가 안 먹는 경우 대비) */
function slideSel(){const lr=list.getBoundingClientRect();
  const fs=$$("#vList .v").filter(r=>{const b=r.getBoundingClientRect();return b.bottom>lr.top&&b.top<lr.bottom;}).map(r=>r.querySelector(".face")).filter(f=>!f.style.transform);
  list.classList.add("nt");const before=fs.map(f=>getComputedStyle(f).transform);applySel();const after=fs.map(f=>getComputedStyle(f).transform);
  fs.forEach((f,i)=>{if(before[i]!==after[i])f.animate([{transform:before[i]},{transform:after[i]}],{duration:220,easing:"cubic-bezier(.3,.7,.3,1)"});});
  requestAnimationFrame(()=>list.classList.remove("nt"));}
function applySel(){list.classList.toggle("selon",!!DB.sel);list.classList.toggle("delon",!!DB.del);}
/* 로고 줄 오른쪽 빈 곳을 톡 → 단어장 맨 위(첫 단어)로 */
/* 위 터치(로고 줄 빈 곳) / 아래 터치(검색창 아래): 가는 길에 핀이 있으면 먼저 핀, 한 번 더 누르면 맨 위·맨 아래 */
function jump(dir){if(EDITING||ADD)return;const k=VOC().findIndex(v=>v.pin);
  if(k>=0&&$("#vSearch").value){$("#vSearch").value="";$("#vClear").classList.add("hidden");renderVocab();}
  const c=centerIndex();
  if(k>=0&&c!==null&&(dir<0?c>k:c<k)){const r=$(`#vList .v[data-i="${k}"]`);if(r){list.scrollTo({top:r.offsetTop+r.offsetHeight/2-list.clientHeight/2,behavior:"smooth"});return;}}
  list.scrollTo({top:dir<0?0:list.scrollHeight,behavior:"smooth"});}
$("#titlebar").addEventListener("click",e=>{if(e.target.closest("#logo"))return;jump(-1);});
const TRASH='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/></svg>';
const PIN='<span class="pinx" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5l-4 4l-4 1.5l-1.5 1.5l7 7l1.5-1.5l1.5-4l4-4"/><path d="M9 15l-4.5 4.5"/><path d="M14.5 4l5.5 5.5"/></svg></span>';
/* 핀 박기: 하나만, 새로 박으면 옮겨감, 핀 라인을 다시 꾹 = 취소 */
function setPin(el){const w=VOC()[+el.dataset.i];if(!w)return;ac();SFX.tuk();const was=!!w.pin;VOC().forEach(v=>{if(v.pin)delete v.pin;});
  $$("#vList .v.pin").forEach(r=>{r.classList.remove("pin");const x=r.querySelector(".pinx");if(x)x.remove();});
  if(!was){w.pin=true;el.classList.add("pin");el.insertAdjacentHTML("beforeend",PIN);}save();}   // 핀을 다시 꾹 = 취소 (박기·취소 모두 툭)
/* 글자 위를 눌렀는지 (아니면 빈 곳 = 핀) */
function onText(span,x,y){if(!span||getComputedStyle(span).visibility==="hidden")return false;const r=document.createRange();r.selectNodeContents(span);
  return [...r.getClientRects()].some(b=>x>=b.left-3&&x<=b.right+3&&y>=b.top-3&&y<=b.bottom+3);}
function renderVocab(){$("#vUndo").disabled=!VDEL.length;const q=$("#vSearch").value.trim().toLowerCase();
  const rows=VOC().map((v,i)=>({v,i})).filter(({v})=>!q||v.en.toLowerCase().includes(q)||v.ko.includes(q));applyV();
  if(!VOC().length){list.innerHTML='<div class="vempty">가져오기로 단어 파일(CSV)을<br>불러와 주세요</div>';lastC=null;return;}
  if(!rows.length){list.innerHTML='<div class="vempty">찾는 단어가 없어요</div>';lastC=null;return;}
  list.innerHTML='<div class="pad"></div>'+TGS()+'<div id="vAdd">'+ADDROW()+'</div>'+rows.map(({v,i})=>`<div class="v${v.sel?" sel":""}${v.pin?" pin":""}" data-i="${i}"><div class="under del">삭제</div><span class="star" aria-hidden="true">★</span><span class="trash" aria-hidden="true">${TRASH}</span><div class="face"><span class="ko">${esc(v.ko)}</span><span class="en">${esc(v.en)}</span></div>${v.pin?PIN:""}</div>`).join("")+'<div class="pad"></div>';
  applySel();pads();$$("#vList .v").forEach(bindRow);lastC=centerIndex();showNum();}
function pads(){const r=$$("#vList .v"),p=$$("#vList .pad");if(!r.length||p.length<2)return;const h=list.clientHeight,t=$("#vList .tgs"),a=$("#vAdd");
  const g=getComputedStyle(r[0].querySelector(".face")).gridTemplateColumns.split(" ")[0];list.style.setProperty("--bw",g);
  p[0].style.height=Math.max(0,h/2-r[0].offsetHeight/2-(t?t.offsetHeight:0)-(a?a.offsetHeight:0))+"px";p[1].style.height=Math.max(0,h/2-r[r.length-1].offsetHeight/2)+"px";}
addEventListener("resize",()=>{pads();});
function centerRow(){const mid=list.scrollTop+list.clientHeight/2;let best=null,bd=1e9;
  $$("#vList .v").forEach(r=>{const d=Math.abs(r.offsetTop+r.offsetHeight/2-mid);if(d<bd){bd=d;best=r}});return best;}
function centerIndex(){const r=centerRow();return r?+r.dataset.i:null;}
function scrollToWord(i,smooth){const r=$(`#vList .v[data-i="${i}"]`);if(!r)return;
  list.scrollTo({top:r.offsetTop+r.offsetHeight/2-list.clientHeight/2,behavior:smooth?"smooth":"auto"});lastC=i;const n=$("#vNum");if(n&&!n.querySelector("input"))n.textContent=String(i+1);}
list.addEventListener("touchstart",()=>{userScroll=true;ac();},{passive:true});
list.addEventListener("wheel",()=>{userScroll=true;},{passive:true});
list.addEventListener("scroll",()=>{const c=centerIndex();if(c!==lastC){lastC=c;showNum();if(userScroll&&!EDITING)SFX.tick();}});
function showNum(){const el=$("#vNum");if(el.querySelector("input"))return;const c=centerIndex();el.textContent=c===null?"":String(c+1);}
(()=>{const em=$("#vNum");let inp=null,dg=null;
  const close=go=>{if(!inp)return;const v=inp.value.trim(),el=inp;inp=null;el.remove();
    if(go&&v&&VOC().length){let n=parseInt(v,10);if(isFinite(n)){n=Math.max(1,Math.min(VOC().length,n));
      if($("#vSearch").value){$("#vSearch").value="";$("#vClear").classList.add("hidden");renderVocab();}
      if(n-1!==centerIndex()){SFX.tok();scrollToWord(n-1,false);}}}
    showNum();};
  em.addEventListener("pointerdown",e=>{e.stopPropagation();if(inp)return;const d={y:e.clientY,id:e.pointerId,long:false};
    d.tm=setTimeout(()=>{if(dg===d&&VOC().length){d.long=true;ac();SFX.tok();}},500);dg=d;try{em.setPointerCapture(e.pointerId)}catch(_){}});
  em.addEventListener("pointermove",e=>{if(!dg||e.pointerId!==dg.id||dg.long)return;if(Math.abs(e.clientY-dg.y)<10)return;clearTimeout(dg.tm);dg=null;});
  em.addEventListener("pointerup",e=>{e.stopPropagation();const d=dg;dg=null;if(!d)return;clearTimeout(d.tm);if(d.long)open();});   // 키보드는 손을 뗄 때 띄워야 아이폰에서 올라옴
  em.addEventListener("pointercancel",()=>{if(dg)clearTimeout(dg.tm);dg=null;});
  em.addEventListener("click",e=>e.stopPropagation());
  function open(){if(inp)return;em.textContent="";inp=document.createElement("input");
    Object.assign(inp,{type:"text",inputMode:"numeric",pattern:"[0-9]*",autocomplete:"off",enterKeyHint:"go",value:""});inp.className="goin";em.appendChild(inp);
    inp.addEventListener("input",()=>{inp.value=inp.value.replace(/\D/g,"").slice(0,5);});
    inp.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();inp.blur();}else if(ev.key==="Escape"){inp.value="";inp.blur();}});
    inp.addEventListener("blur",()=>close(true));inp.focus();}})();   // 빈칸에 커서만, 아무것도 안 넣고 내리면 원래 번호로   // 가운데가 바뀔 때마다 틱 → 타라락

function bindRow(el){const face=el.querySelector(".face"),del=el.querySelector(".del");let g=null,lpT=null,lp=null;
  el.addEventListener("pointerdown",e=>{if(EDITING||e.button>0)return;userScroll=true;el.classList.add("peek");
    const rr=el.getBoundingClientRect();g={x0:e.clientX,y0:e.clientY,dx:0,axis:null,t:performance.now(),trash:!!DB.del&&e.clientX-rr.left<40};const tgt=e.target.closest(".en,.ko"),px=e.clientX,py=e.clientY;lp=null;clearTimeout(lpT);
    lpT=setTimeout(()=>{if(!g||g.axis)return;if(onText(tgt,px,py)){lp={tgt,px,py};ac();SFX.tok();return;}
      const fr=rr.right-px;if(fr>=20&&fr<=60){g.pinned=true;setPin(el);}},500);});   // 핀은 핀 자리(오른쪽 끝에서 20~60px)에서만, 나머지 빈 곳은 숨김보기
  el.addEventListener("pointermove",e=>{if(!g||g.pinned)return;const dx=e.clientX-g.x0,dy=e.clientY-g.y0;
    if(!g.axis&&Math.hypot(dx,dy)>10){g.axis=Math.abs(dx)>Math.abs(dy)?"x":"y";clearTimeout(lpT);if(g.axis==="y")el.classList.remove("peek");if(g.axis==="x")try{el.setPointerCapture(e.pointerId)}catch(_){}}
    if(g.axis!=="x")return;g.dx=dx;
    if(dx>0){face.style.transition="none";face.style.willChange="transform";
      if(DB.del){if(g.trash){face.style.transform=`translateX(${22+dx}px)`;del.style.opacity=1;}}                                   // 삭제 토글: 오른쪽 = 삭제
      else{const base=DB.sel&&el.classList.contains("sel")?22:0;face.style.transform=`translateX(${base+Math.min(56,dx*.55)}px)`;}}   // 그 외: 선택
    else{face.style.transform="";del.style.opacity=0;if(!fReady)prepFlash();$("#rail").classList.add("drag");$("#rail").style.transform=`translate3d(${Math.min(0,dx+10)}px,0,0)`;}});   // 왼쪽 = 점멸 화면
  const up=e=>{clearTimeout(lpT);setTimeout(()=>{face.style.willChange=""},260);if(lp&&e.type==="pointerup"){const L=lp;lp=null;g=null;startEdit(el,L.tgt,L.px,L.py);return;}lp=null;
    if(EDITING)return;el.classList.remove("peek");if(!g)return;const G=g;g=null;if(G.pinned)return;
    const rail=$("#rail");rail.classList.remove("drag");rail.style.transform="";
    if(G.axis==="x"&&G.dx<0){face.style.transform="";if(flick(G.dx,G.t,-1)){goFlash();return;}fReady=false;return;}
    face.style.transition="";
    if(G.axis==="x"&&G.dx>0&&!DB.del){face.style.transform="";if(G.dx>50||flick(G.dx,G.t,1)){ac();const w=VOC()[+el.dataset.i];
        if(w){(w.sel?SFX.tuk:SFX.tok)();w.sel=!w.sel;if(!w.sel)delete w.sel;el.classList.toggle("sel",!!w.sel);save();fReady=false;}}return;}       // 선택/해제 (둘 다 꺼져 있으면 소리만, 목록엔 반영)
    face.style.transition="transform .2s";
    if(G.axis==="x"&&DB.del&&G.trash&&G.dx>el.clientWidth*.3){ac();SFX.tok();face.style.transform="translateX(100%)";
      setTimeout(()=>{const k=+el.dataset.i;if(VOC()[k]){VDEL.push({v:VOC()[k],k});if(VDEL.length>7)VDEL.shift();VOC().splice(k,1);if(k<DB.pos)DB.pos--;}
        save();const keep=list.scrollTop;renderVocab();list.scrollTop=keep;},200);}
    else{face.style.transform="";setTimeout(()=>del.style.opacity=0,200);}};
  ["pointerup","pointercancel"].forEach(t=>el.addEventListener(t,up));}

/* 단어장 빈 곳(머리·검색줄)에서 왼쪽으로 밀어도 점멸 화면으로 */
(()=>{const el=$("#vocab");let g=null;
  el.addEventListener("pointerdown",e=>{if(EDITING||e.target.closest(".v,input,button,#logo"))return;g={x0:e.clientX,y0:e.clientY,axis:null,t:performance.now()};});
  el.addEventListener("pointermove",e=>{if(!g)return;const dx=e.clientX-g.x0,dy=e.clientY-g.y0;if(!g.axis&&Math.hypot(dx,dy)>10)g.axis=Math.abs(dx)>Math.abs(dy)?"x":"y";
    if(g.axis==="x"&&dx<0){if(!fReady)prepFlash();$("#rail").classList.add("drag");$("#rail").style.transform=`translate3d(${Math.min(0,dx+10)}px,0,0)`;}});
  const end=e=>{if(!g)return;const G=g;g=null;$("#rail").classList.remove("drag");$("#rail").style.transform="";
    if(G.axis==="x"&&flick(e.clientX-G.x0,G.t,-1))goFlash();else fReady=false;};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);})();

/* 꾹 누르면 누른 자리에 커서 (앞뒤 선택 없음) — 손을 뗄 때 키보드가 뜸 */
function startEdit(el,span,x,y){EDITING=true;el.classList.add("peek");list.style.overflowY="hidden";
  const field=span.classList.contains("en")?"en":"ko",orig=span.textContent;span.contentEditable="true";span.focus();
  let r=null;if(document.caretRangeFromPoint)r=document.caretRangeFromPoint(x,y);
  else if(document.caretPositionFromPoint){const c=document.caretPositionFromPoint(x,y);if(c){r=document.createRange();r.setStart(c.offsetNode,c.offset);}}
  if(!r||!span.contains(r.startContainer)){r=document.createRange();r.selectNodeContents(span);r.collapse(false);}
  r.collapse(true);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
  const done=()=>{span.removeEventListener("blur",done);span.contentEditable="false";const val=norm(span.textContent),k=+el.dataset.i;
    if(VOC()[k]&&val&&val!==orig){const nv={...VOC()[k],[field]:val};
      if(VOC().some((v,i)=>i!==k&&same(v,nv))){toast("이미 있는 단어예요");span.textContent=orig;}else{VDEL.push({edit:true,obj:VOC()[k],field,orig,now:val});if(VDEL.length>7)VDEL.shift();$("#vUndo").disabled=false;
        VOC()[k][field]=val;span.textContent=val;save();}}
    else span.textContent=orig;
    el.classList.remove("peek");list.style.overflowY="";EDITING=false;pads();};
  span.addEventListener("blur",done);
  const outside=e=>{if(span.contains(e.target))return;e.preventDefault();e.stopPropagation();span.blur();
    const eat=ev=>{ev.preventDefault();ev.stopPropagation();};document.addEventListener("click",eat,{capture:true,once:true});setTimeout(()=>document.removeEventListener("click",eat,true),400);};
  document.addEventListener("pointerdown",outside,true);
  span.addEventListener("blur",()=>document.removeEventListener("pointerdown",outside,true),{once:true});
  span.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();span.blur();}if(e.key==="Escape"){span.textContent=orig;span.blur();}});}

/* 가져오기: 한,영 / 영,한 CSV 모두 — 한·영 둘 다 같은 단어만 빼고 추가 */
function parseCSV(t){const out=[];let row=[],cur="",q=false;t=t.replace(/^﻿/,"");
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'&&t[i+1]==='"'){cur+='"';i++;}else if(c==='"')q=false;else cur+=c;}
    else if(c==='"')q=true;else if(c===","||c==="\t"){row.push(cur);cur="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);out.push(row);row=[];cur="";}else cur+=c;}
  if(cur||row.length){row.push(cur);out.push(row);}return out;}
const HG=/[가-힣]/;
/* 내보내기: 고쉐와 동일 — 제목 줄 없이 한국어,영어 / 저장된 순서 / 공유 화면 */
const csvCell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
$("#vExport").onclick=async()=>{ac();SFX.tok();if(!VOC().length){toast("저장한 단어가 없어요");return;}
  const d=new Date(),p=n=>String(n).padStart(2,"0"),name=`danju-단어장-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.csv`;
  const body="\uFEFF"+VOC().map(v=>csvCell(v.ko)+","+csvCell(v.en)).join("\r\n")+"\r\n";
  const file=new File([body],name,{type:"text/csv"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);};
$("#vImport").onclick=()=>{ac();SFX.tok();$("#vFile").click();};
$("#vFile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;let n=0,skip=0;
  for(const r of parseCSV(await f.text())){if(r.length<2)continue;const a=norm(r[0]),b=norm(r[1]);if(!a||!b)continue;
    if(/^(영어|english|en|word|한국어|korean|ko)$/i.test(a))continue;                    // 제목 줄
    const w=HG.test(a)&&!HG.test(b)?{en:b,ko:a}:{en:a,ko:b};
    if(VOC().some(v=>same(v,w))){skip++;continue;}VOC().push(w);n++;}
  save();renderVocab();toast(n?`${n}개 가져왔어요`+(skip?` (같은 단어 ${skip}개 제외)`:""):"새로 추가할 단어가 없어요");};

$("#vSearch").addEventListener("input",()=>{if(ADD)return;renderVocab();$("#vClear").classList.toggle("hidden",!$("#vSearch").value);});
$("#vSearch").addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();if(ADD)addFromBar();else e.target.blur();});

/* ── 추가: 검색창 꾹 → + 모드. 위 빈칸에 직접 쓰거나 + 창에 "word 뜻" 쓰고 엔터.
   한 칸이라도 채우면 위에 빈칸 한 줄 더. 한·영 자리를 바꿔 넣으면 자동으로 바꿈. 바깥을 누르거나 키보드를 내리면 끝 */
let ADD=false;
const hasK=t=>/[\u3131-\u318E\uAC00-\uD7A3]/.test(t);
function ADDROW(){return '<div class="va"><div class="face"></div></div>';}
function addRowEl(){const r=document.createElement("div");r.className="va";r.innerHTML='<div class="face"><input class="ko" autocomplete="off" enterkeyhint="done" aria-label="뜻"><input class="en" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="영어"></div>';
  r.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("focus",()=>shade(inp));inp.addEventListener("blur",()=>{shade(inp);setTimeout(()=>{if(!r.contains(document.activeElement))fixRow(r);},0);});
    inp.addEventListener("input",()=>{shade(inp);ensureTopBlank();});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();inp.blur();}});});
  r.querySelectorAll("input").forEach(shade);return r;}
function shade(inp){inp.classList.toggle("blank",!inp.value&&document.activeElement!==inp);}       // 커서가 올라가면 음영은 바로 사라짐
function rowVal(r){const[k,e]=r.querySelectorAll("input");return{ko:norm(k.value),en:norm(e.value)};}
function swapFix(o){const kk=o.ko?hasK(o.ko):null,ek=o.en?hasK(o.en):null;
  if((kk===false&&ek!==false)||(ek===true&&kk!==true))return{ko:o.en,en:o.ko};return o;}
function fixRow(r){const v=rowVal(r),f=swapFix(v);if(f!==v){const[k,e]=r.querySelectorAll("input");k.value=f.ko;e.value=f.en;shade(k);shade(e);}}
function ensureTopBlank(){const box=$("#vAdd");if(!box)return;const top=box.querySelector(".va");const v=top&&top.querySelector("input")?rowVal(top):null;
  if(!v||v.ko||v.en){box.prepend(addRowEl());pads();}}
function enterAdd(){if(ADD)return;if($("#vSearch").value){$("#vSearch").value="";$("#vClear").classList.add("hidden");renderVocab();}
  const box=$("#vAdd");if(!box)return;ADD=true;$(".search").classList.add("add");$("#vSearch").placeholder="";
  box.innerHTML="";box.appendChild(addRowEl());box.classList.add("on");pads();list.scrollTo({top:0});}
function addFromBar(){const t=norm($("#vSearch").value);if(!t)return;const en=[],ko=[];
  t.split(" ").forEach(w=>(hasK(w)?ko:en).push(w));
  const box=$("#vAdd");let top=box.querySelector(".va");const v=rowVal(top);if(v.ko||v.en){box.prepend(addRowEl());top=box.querySelector(".va");}
  const[k,e]=top.querySelectorAll("input");k.value=ko.join(" ");e.value=en.join(" ");shade(k);shade(e);
  ensureTopBlank();$("#vSearch").value="";ac();SFX.tok();}
function finishAdd(){if(!ADD)return;ADD=false;const box=$("#vAdd");$(".search").classList.remove("add");$("#vSearch").placeholder="저장한 단어 검색";
  if($("#vSearch").value)addFromBar();$("#vSearch").value="";
  const items=[];if(box)box.querySelectorAll(".va").forEach(r=>{if(!r.querySelector("input"))return;const o=swapFix(rowVal(r));if(!o.ko&&!o.en)return;
    if(VOC().some(v=>same(v,o))||items.some(v=>same(v,o)))return;items.push(o);});
  if(items.length){VOC().unshift(...items);DB.pos+=items.length;save();}
  renderVocab();list.scrollTo({top:0});}
(()=>{let lt=null,st=null;
  list.addEventListener("pointerdown",e=>{const sp=e.target.closest("#vAdd");if(ADD||!sp||EDITING)return;st={x:e.clientX,y:e.clientY};clearTimeout(lt);
    lt=setTimeout(()=>{if(!st)return;st=null;ac();SFX.tok();enterAdd();},500);});
  list.addEventListener("pointermove",e=>{if(st&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>10){clearTimeout(lt);st=null;}});
  ["pointerup","pointercancel"].forEach(t=>list.addEventListener(t,()=>{clearTimeout(lt);st=null;}));
  $("#vocab").addEventListener("focusout",()=>setTimeout(()=>{if(ADD&&!(document.activeElement&&document.activeElement.closest(".va,.search")))finishAdd();},60));
  document.addEventListener("pointerdown",e=>{if(!ADD||e.target.closest(".va,.search"))return;e.preventDefault();e.stopPropagation();
    const a=document.activeElement;if(a&&a.blur)a.blur();finishAdd();
    const eat=ev=>{ev.preventDefault();ev.stopPropagation();};document.addEventListener("click",eat,{capture:true,once:true});setTimeout(()=>document.removeEventListener("click",eat,true),400);},true);})();
$("#pinGo").addEventListener("click",e=>{e.stopPropagation();jump(1);});
$("#vClear").onclick=()=>{$("#vSearch").value="";$("#vClear").classList.add("hidden");renderVocab();};

/* ── 시작: 단어장 화면 ── */
async function wake(){try{await navigator.wakeLock?.request("screen")}catch(_){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")wake();else setPlaying(false);});
wake();
buildSet();show(steps[0]);stepIdx=1;drawMeter(false);prepVocab();requestAnimationFrame(()=>{movePill();pads();scrollToWord(DB.pos,false);});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
